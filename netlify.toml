# Netlify settings — no build step needed, the site is plain HTML/CSS/JS.
[build]
  publish = "."
  command = ""

# Keep the docs in the repo but not on the public site
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DEPLOY-GUIDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_src/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true
